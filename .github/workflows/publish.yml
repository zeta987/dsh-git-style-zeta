name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # setup-node v7 removed its dummy NODE_AUTH_TOKEN fallback; this
          # registry configuration is safe with npm trusted publishing.
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing requires npm 11.5.1 or newer.
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Install exact dependencies
        run: npm ci

      - name: Check release tag and choose npm dist-tag
        id: release
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          echo "dist_tag=$(node scripts/check-release.mjs --dist-tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Run release checks
        run: npm run check

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      # Authentication comes only from GitHub's short-lived OIDC identity.
      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.release.outputs.dist_tag }}"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="$(npm pack --silent)"
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          prerelease=()
          if [ "$(node scripts/check-release.mjs --dist-tag "$GITHUB_REF_NAME")" = "next" ]; then
            prerelease+=(--prerelease)
          fi
          cat > release-notes.md <<EOF
          Install or update:

          \`\`\`sh
          dsh plugin --profile web add dsh-git-style-zeta@$version
          # restart the host
          \`\`\`

          README: [English]($base/README.md) · [繁體中文]($base/README.zh-TW.md) · [简体中文]($base/README.zh-CN.md)
          EOF
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "dsh-git-style-zeta $version" --notes-file release-notes.md --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber
